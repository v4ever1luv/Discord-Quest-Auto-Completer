[project]
name = "discord-quest"
version = "4.0.0"
description = "Discord Quest Auto-Completer"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "structlog>=25.1",
    "cryptography>=44.0",
    "keyring>=25.6",
    "websockets>=15.0",
    "discord-py>=2.5,<3",
]

[project.scripts]
discord-quest = "discord_quest.__main__:main"
discord-quest-bot = "discord_quest.bot.__main__:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "D", "UP", "YTT"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]

[tool.mypy]
strict = true
python-version = "3.14"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
